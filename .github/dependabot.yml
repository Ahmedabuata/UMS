version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/Identity.Microservice/src/Identity.Api"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "nuget"
    directory: "/HR.Microservice/HR.Api"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/identity-web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"

  - package-ecosystem: "docker"
    directory: "/Identity.Microservice/src/Identity.Api"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/HR.Microservice/HR.Api"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
