# ================================================================
# Dependabot Configuration
# ================================================================
version: 2
updates:
  # ============================================================
  # 1. Identity Microservice - .NET / NuGet
  # ============================================================
  - package-ecosystem: "nuget"
    directory: "/Identity.Microservice/src/Identity.Api"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ============================================================
  # 2. HR Microservice - .NET / NuGet
  # ============================================================
  - package-ecosystem: "nuget"
    directory: "/HR.Microservice/HR.Api"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ============================================================
  # 3. Frontend - npm (identity-web)
  # ============================================================
  - package-ecosystem: "npm"
    directory: "/identity-web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    groups:
      react:
        patterns:
          - "react*"
          - "@types/react*"
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
    ignore:
      - dependency-name: "esbuild"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]

  # ============================================================
  # 4. Docker - Identity Microservice
  # ============================================================
  - package-ecosystem: "docker"
    directory: "/Identity.Microservice/src/Identity.Api"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"

  # ============================================================
  # 5. Docker - HR Microservice
  # ============================================================
  - package-ecosystem: "docker"
    directory: "/HR.Microservice/HR.Api"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"

  # ============================================================
  # 6. GitHub Actions
  # ============================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"