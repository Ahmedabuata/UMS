name: Dependency Vulnerability Check

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  dotnet-check:
    name: .NET Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Check Identity.Api
        run: |
          dotnet restore ./Identity.Microservice/src/Identity.Api
          dotnet list ./Identity.Microservice/src/Identity.Api package --vulnerable --include-transitive

      - name: Check HR.Api
        run: |
          dotnet restore ./HR.Microservice/HR.Api
          dotnet list ./HR.Microservice/HR.Api package --vulnerable --include-transitive

  npm-check:
    name: NPM Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: NPM Audit
        run: |
          cd identity-web
          npm ci
          npm audit --audit-level=moderate
        continue-on-error: true

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-results.txt'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results as artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-scan-results
          path: trivy-results.txt
