services:
  ums-db:
    image: postgres:15-alpine
    container_name: ums-db
    environment:
      POSTGRES_DB: ums_db
      POSTGRES_USER: ums_user
      POSTGRES_PASSWORD: Ums_Pass_2024!
    ports: ["5432:5432"]
    volumes: [ums_pgdata:/var/lib/postgresql/data]
  ums-redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  ums-api:
    build: {context: ., dockerfile: Dockerfile.api}
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: "Host=ums-db;Port=5432;Database=ums_db;Username=ums_user;Password=Ums_Pass_2024!"
      ConnectionStrings__RabbitMQ: "amqp://guest:guest@rabbitmq:5672"
    ports: ["8080:8080"]
    depends_on: [ums-db, rabbitmq]
  hr-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: hr_microservice_db
      POSTGRES_USER: hr_user
      POSTGRES_PASSWORD: Hr_Pass_2024!
    ports: ["5433:5432"]
    volumes: [hr_pgdata:/var/lib/postgresql/data]
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports: ["5672:5672", "15672:15672"]
  hr-api:
    build: {context: ./HR.Microservice/HR.Api, dockerfile: Dockerfile}
    environment:
      ConnectionStrings__HrConnection: "Host=hr-db;Port=5432;Database=hr_microservice_db;Username=hr_user;Password=Hr_Pass_2024!"
      RabbitMQ__Host: "rabbitmq"
    ports: ["5002:80", "5003:88"]
    depends_on: [hr-db, rabbitmq]
volumes:
  ums_pgdata:
  hr_pgdata:
