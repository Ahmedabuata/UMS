services:
  # ============================================================
  # Databases
  # ============================================================
  ums-db:
    image: postgres:15-alpine
    container_name: ums-db
    environment:
      POSTGRES_DB: ums_db
      POSTGRES_USER: ums_user
      POSTGRES_PASSWORD: ${POSTGRES_UMS_PASSWORD}
    ports: ["5432:5432"]
    volumes: [ums_pgdata:/var/lib/postgresql/data]

  hr-db:
    image: postgres:15-alpine
    container_name: hr-db
    environment:
      POSTGRES_DB: hr_microservice_db
      POSTGRES_USER: ums_user
      POSTGRES_PASSWORD: ${POSTGRES_HR_PASSWORD}
    ports: ["5433:5432"]
    volumes: [hr_pgdata:/var/lib/postgresql/data]

  identity-db:
    image: postgres:15-alpine
    container_name: identity-db
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: ums_user
      POSTGRES_PASSWORD: ${POSTGRES_IDENTITY_PASSWORD}
    ports: ["5434:5432"]
    volumes: [identity_pgdata:/var/lib/postgresql/data]

  # ============================================================
  # Cache & Message Broker
  # ============================================================
  ums-redis:
    image: redis:7-alpine
    container_name: ums-redis
    ports: ["6379:6379"]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports: ["5672:5672", "15672:15672"]

  # ============================================================
  # APIs
  # ============================================================
  ums-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ums-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: ${CONNECTION_UMS_DB}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
    ports: ["8080:8080"]
    depends_on: [ums-db, rabbitmq]

  hr-api:
    build:
      context: ./HR.Microservice/HR.Api
      dockerfile: Dockerfile
    container_name: hr-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__HrConnection: ${CONNECTION_HR_DB}
      ConnectionStrings__UmsConnection: ${CONNECTION_UMS_DB}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      JWT__Key: ${JWT_KEY}
    ports: ["5002:80", "5003:88"]
    depends_on: [hr-db, rabbitmq]

  identity-api:
    build:
      context: ./Identity.Microservice/src/Identity.Api
      dockerfile: Dockerfile
    container_name: identity-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__IdentityDb: ${CONNECTION_IDENTITY_DB}
      Jwt__Key: ${JWT_KEY}
      Jwt__RefreshTokenPepper: ${JWT_REFRESH_PEPPER}
      Jwt__Issuer: Identity.Api
      Jwt__Audience: identity-web
      EmailSettings__SmtpHost: sandbox.smtp.mailtrap.io
      EmailSettings__SmtpPort: 2525
      EmailSettings__SmtpUser: ${SMTP_USER}
      EmailSettings__SmtpPass: ${SMTP_PASS}
    ports: ["5000:80"]
    depends_on: [identity-db]

volumes:
  ums_pgdata:
  hr_pgdata:
  identity_pgdata: